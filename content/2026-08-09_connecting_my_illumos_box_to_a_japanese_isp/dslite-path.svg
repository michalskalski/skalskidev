<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title description">
  <title id="title">The DS-Lite packet path</title>
  <desc id="description">An IPv4 packet enters the B4 on the illumos host, crosses the provider network inside IPv6, reaches the AFTR, and continues to the IPv4 Internet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="20" y="75" width="210" height="130" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="125" y="115" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#0f172a">illumos box</text>
  <text x="125" y="148" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#0f172a">DS-Lite B4</text>
  <text x="125" y="177" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">IPv4 enters the tunnel</text>

  <rect x="295" y="75" width="210" height="130" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="400" y="123" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#0f172a">ISP access</text>
  <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#0f172a">IPv6 network</text>
  <text x="400" y="181" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">IPv4 inside IPv6</text>

  <rect x="570" y="75" width="180" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="660" y="123" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#0f172a">AFTR</text>
  <text x="660" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">decapsulation</text>
  <text x="660" y="181" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">and NAT</text>

  <rect x="815" y="75" width="165" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="897" y="126" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#0f172a">IPv4</text>
  <text x="897" y="158" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">Internet</text>

  <line x1="230" y1="140" x2="290" y2="140" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="505" y1="140" x2="565" y2="140" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="750" y1="140" x2="810" y2="140" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="500" y="255" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">The operating system performs encapsulation and forwarding</text>
</svg>
